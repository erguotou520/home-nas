[package]
name = "home-nas-server"
version = "0.1.0"
edition = "2021"
authors = ["Home NAS Team"]
description = "A cross-platform NAS management server"

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
actix-files = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-std = { version = "1", features = ["attributes"] }

# Database - use 0.12 for compatibility
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Auth
jsonwebtoken = "9"
bcrypt = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
regex-lite = "0.1"

# Media processing
image = "0.24"
lofty = "0.18"
quick-xml = "0.31"

# File handling
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
actix-http = "3"
